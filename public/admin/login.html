<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Digi Tail Studios</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/assets/css/core.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--card-surface);
            border: var(--border-width) solid var(--long-black);
            box-shadow: var(--shadow-xl);
            border-radius: var(--radius);
            padding: 3rem 2.5rem;
            width: 90%;
            max-width: 420px;
            color: var(--long-black);
            transform: rotate(-1deg);
        }

        .login-card h1 {
            font-family: var(--font-display);
            font-size: 2.6rem;
            text-transform: uppercase;
            margin: 0 0 0.25rem 0;
            line-height: 1;
        }

        .login-card .sub {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            margin: 0 0 2rem 0;
            opacity: 0.7;
        }

        label {
            display: block;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1.25rem;
            border: var(--border-width) solid var(--long-black);
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 1rem;
            background: var(--extra-foam);
            color: var(--long-black);
        }

        button[type="submit"] {
            width: 100%;
            justify-content: center;
            font-size: 1rem;
            padding: 0.85rem;
        }

        .error {
            background: var(--alert-red);
            color: #fff;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.75rem 1rem;
            border: var(--border-width) solid var(--long-black);
            border-radius: var(--radius);
            margin-bottom: 1.25rem;
            display: none;
        }

        .error.show { display: block; }

        .back {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--long-black);
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .login-card { transform: rotate(0deg); padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>The Den</h1>
        <p class="sub">// studio access only</p>

        <div class="error" id="error"></div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="username" autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password">

            <button type="submit" class="btn-rugged" id="submit">Sign in</button>
        </div>

        <a href="/" class="back">back to the site</a>
    </div>

    <script>
        const emailEl = document.getElementById('email');
        const passEl  = document.getElementById('password');
        const btn     = document.getElementById('submit');
        const errEl   = document.getElementById('error');

        function showError(msg) {
            errEl.textContent = msg;
            errEl.classList.add('show');
        }

        async function login() {
            errEl.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Checking...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailEl.value,
                        password: passEl.value,
                    }),
                });
                const data = await res.json();

                if (res.ok) {
                    window.location.href = '/admin/';
                    return;
                }
                showError(data.error || 'Could not sign in.');
            } catch {
                showError('Could not reach the server. Check your connection.');
            }

            btn.disabled = false;
            btn.textContent = 'Sign in';
            passEl.value = '';
        }

        btn.addEventListener('click', login);
        [emailEl, passEl].forEach((el) =>
            el.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); })
        );
    </script>
</body>
</html>
