name = "digitail-studios"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Static files. The Worker hands anything that isn't /api/* straight here.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# Content database
[[d1_databases]]
binding = "DB"
database_name = "digitail"
database_id = "bcecdc93-fc38-4ef3-a1f0-516b6f08a0a1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "digitail-media"