name = "digitail-site"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Static files. The Worker hands anything that isn't /api/* straight here.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# Content database
[[d1_databases]]
binding = "DB"
database_name = "digitail"
database_id = "bcecdc93-fc38-4ef3-a1f0-516b6f08a0a1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "digitail-media"
# Nightly traffic snapshot. 03:17 UTC, which is after UTC midnight so
# "yesterday" is a complete day. Deliberately not on the hour - every
# cron on the platform fires at :00 and the queue is longer there.
# Free plan allows 3 crons per Worker; this is the first.
[triggers]
crons = ["17 3 * * *"]

# Cloudflare Access, shared with the studio hub.
#
# Neither value is a credential. The AUD tag is stamped into every token
# Access issues and Cloudflare's own docs tell you to put it in your
# validation script; the team domain appears in the address bar during
# login. They must MATCH the hub's exactly - same application, same values.
[vars]
ACCESS_TEAM_DOMAIN = "autumn-recipe-b82c.cloudflareaccess.com"
ACCESS_AUD = "89b16d953df151a6b1f0c82fcdf13fecd0bb783507a67b551081dc8da1f9cee1"
